name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx expo export --platform ios --output-dir /tmp/dist
      - run: npm run typecheck
      - run: npx expo lint
      - run: npm test -- --ci
